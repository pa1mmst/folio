<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}folio{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    :root {
      --bg-page: #0b0a09;
      --bg-panel: #141210;
      --bg-primary: #141210;
      --bg-secondary: #1a1815;
      --bg-tertiary: #1f1c18;
      --bg-hover: #2a2620;
      --text-primary: #f5f3f0;
      --text-secondary: #b8b0a8;
      --text-muted: #8a8f98;
      --accent: #5e6ad2;
      --accent-hover: #6b7ddb;
      --accent-muted: rgba(94, 106, 210, 0.08);
      --border: rgba(255,255,255,0.08);
      --border-muted: rgba(255,255,255,0.05);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --font-display: 'Instrument Serif', serif;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --space: 8px;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:var(--font-sans);
      font-feature-settings:"kern","liga","calt";
      background:var(--bg-page);
      color:var(--text-primary);
      font-size:var(--font-size-base, 16px);
      font-weight:400;line-height:1.6;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
      text-rendering:optimizeLegibility;
      min-height:100vh;
    }
    a { color:var(--accent);text-decoration:none;transition:color .15s; }
    a:hover { color:var(--accent-hover); }
    .app-layout { display:flex;max-width:1200px;margin:0 auto;min-height:100vh; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><a href="/" class="sidebar-logo">folio</a></div>
      <nav class="sidebar-nav">
        <a href="/" class="sidebar-link{% if active == 'notes' %} active{% endif %}">Notes</a>
        <a href="/graph" class="sidebar-link{% if active == 'graph' %} active{% endif %}">Graph</a>
      </nav>
      <div class="sidebar-section">
        <div class="sidebar-section-title">Tags</div>
        <div class="sidebar-tags">
          {% for tag in tags %}
          <a href="/?tag={{ tag.tag }}" class="sidebar-tag">#{{ tag.tag }}</a>
          {% endfor %}
        </div>
      </div>
    </aside>
    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
